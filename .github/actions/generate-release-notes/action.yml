# Generate Release Notes：以 LKAIKit 的 lkai 依 commit 記錄撰寫正體中文 Release Notes。
#
# - lkai 只能在 macOS runner 執行，呼叫端的 job 要用 macOS runner（見 .github/actions/setup-lkai）。
# - 供應商與模型由 .github/lkai.json 的 default 設定決定；三個 API 金鑰都傳入，lkai 只讀所選供應商的那一個。
# - AI 失敗或回答不完整時，改用原始 commit 記錄當 Release Notes，不讓發版失敗。
name: Generate Release Notes
description: 以 LKAIKit（lkai）生成正體中文 Release Notes，失敗時改用 commit 記錄

inputs:
  tag:
    description: 版本 tag（如 backend-v1.5.0）
    required: true
  commits_file:
    description: commit 記錄檔案路徑
    required: true
  output_file:
    description: Release Notes 輸出檔案路徑
    required: true
  anthropic_api_key:
    description: Anthropic API 金鑰（.github/lkai.json 的 default 設定中 provider 是 anthropic 時必填）
    required: false
    default: ''
  openai_api_key:
    description: OpenAI API 金鑰（provider 是 openai 時必填）
    required: false
    default: ''
  gemini_api_key:
    description: Google Gemini API 金鑰（provider 是 google 時必填）
    required: false
    default: ''

outputs:
  provider:
    description: 使用的供應商
    value: ${{ steps.lkai.outputs.provider }}
  model:
    description: 使用的模型
    value: ${{ steps.lkai.outputs.model }}

runs:
  using: composite
  steps:
    - name: Setup lkai
      id: lkai
      uses: ./.github/actions/setup-lkai

    - name: Generate release notes
      shell: bash
      env:
        LKAI_PROVIDER: ${{ steps.lkai.outputs.provider }}
        LKAI_MODEL: ${{ steps.lkai.outputs.model }}
        LKAI_ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        LKAI_OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        LKAI_GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        TAG: ${{ inputs.tag }}
        COMMITS_FILE: ${{ inputs.commits_file }}
        OUTPUT_FILE: ${{ inputs.output_file }}
      run: |
        source "$GITHUB_WORKSPACE/.github/scripts/lkai-helpers.sh"

        PROMPT_FILE="$RUNNER_TEMP/release_notes_prompt.md"
        ANSWER_FILE="$RUNNER_TEMP/release_notes_answer.md"
        {
          cat <<'TEMPLATE_EOF'
        你是一位專業的軟體發布管理員。請根據以下 Git commit 記錄，撰寫正體中文的 Release Notes。

        要求：
        1. 使用正體中文撰寫
        2. 按類別分組（如有）：✨ 新功能、🐛 錯誤修正、📈 改進與優化、🔄 重構、🔧 維護
        3. 每項用 bullet point 列出
        4. 簡潔專業
        5. 直接輸出 Markdown 內容，不要加前綴或後綴說明
        TEMPLATE_EOF
          printf '\n版本號：%s\n\nCommit 記錄：\n' "$TAG"
          cat "$COMMITS_FILE"
        } > "$PROMPT_FILE"

        # 退出碼 2（回答不完整）也改用 commit 記錄：截斷的 Release Notes 比原始記錄更容易誤導
        STATUS=0
        ask_lkai "$PROMPT_FILE" "$ANSWER_FILE" --max-output-tokens 16000 --timeout 180 || STATUS=$?

        if [ "$STATUS" -eq 0 ] && [ -s "$ANSWER_FILE" ]; then
          cp "$ANSWER_FILE" "$OUTPUT_FILE"
          {
            echo ""
            echo "---"
            echo "_Generated by LKAIKit (\`${LKAI_PROVIDER}\` / \`${LKAI_MODEL}\`)_"
          } >> "$OUTPUT_FILE"
        else
          echo "::warning::AI 生成 Release Notes 失敗（lkai 退出碼 ${STATUS}），改用 commit 記錄作為 Release Notes"
          {
            echo "## 變更記錄"
            echo ""
            cat "$COMMITS_FILE"
          } > "$OUTPUT_FILE"
        fi

        echo "--- Generated Release Notes ---"
        print_untrusted_text "$(cat "$OUTPUT_FILE")"
