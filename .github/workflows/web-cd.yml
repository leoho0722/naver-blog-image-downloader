name: Web CD

on:
  workflow_run:
    workflows: [Web CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  # 先在 ubuntu 判斷要不要發版：版號沒有更新時就此結束，不必開 macOS runner
  version:
    name: Check Version
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./apps/web/package.json').version")
          if [ -z "$VERSION" ]; then
            echo "::error::無法從 apps/web/package.json 讀取 version 欄位"
            exit 1
          fi
          TAG="web-v${VERSION}"
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::notice::Tag ${TAG} 已存在，跳過發版（版號未更新）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # Release Notes 由 LKAIKit 的 lkai 撰寫，而 lkai 只能在 macOS runner 執行
  release:
    name: Tag & Release
    needs: version
    if: needs.version.outputs.skip == 'false'
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get commits since last web tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git fetch --tags --force
          PREVIOUS_TAG=$(git tag --list "web-v*" --sort=-version:refname | grep -v "^${TAG}$" | head -n 1 || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" -- apps/web)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..HEAD" -- apps/web)
          fi
          echo "$COMMITS" > "$RUNNER_TEMP/commits.txt"

      - name: Generate release notes
        uses: ./.github/actions/generate-release-notes
        with:
          tag: ${{ needs.version.outputs.tag }}
          commits_file: ${{ runner.temp }}/commits.txt
          output_file: ${{ runner.temp }}/release_notes.md
          anthropic_api_key: ${{ secrets.LKAI_ANTHROPIC_API_KEY }}
          openai_api_key: ${{ secrets.LKAI_OPENAI_API_KEY }}
          gemini_api_key: ${{ secrets.LKAI_GEMINI_API_KEY }}

      - name: Create release
        uses: ./.github/actions/create-release
        with:
          tag: ${{ needs.version.outputs.tag }}
          title: "Web v${{ needs.version.outputs.version }}"
          notes_file: ${{ runner.temp }}/release_notes.md
