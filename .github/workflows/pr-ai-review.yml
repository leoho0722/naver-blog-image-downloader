name: PR AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# - pull-requests: write：建立 review。不再發一般留言，所以不需要 issues: write。
# - contents: write：GITHUB_TOKEN 收掉（resolve）上一輪的 AI 討論串需要它；只有 pull-requests: write 時，
#   resolveReviewThread 會回 Resource not accessible by integration（PR #36 實測）。
# 有寫入權限的 token 只以 GH_TOKEN 交給「發布審查結果」這一步，checkout 也不保留 git 憑證，
# 所以建置 lkai、規劃與送審的 script 環境中沒有 token（action 仍可自行引用 github.token，
# 這裡使用的 action 只有 actions/checkout 與以 SHA 固定的 LKAIKit）。
permissions:
  contents: write
  pull-requests: write

# 同一個 PR 有新的 push 時，取消還在執行的舊審查。
# 舊的執行若在「發布之後、收掉舊討論串之前」被取消，下一輪會一併收掉那些討論串。
concurrency:
  group: pr-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: LKAIKit Review
    # lkai 只能在 macOS runner 執行（見 .github/actions/setup-lkai）
    runs-on: xcode-27
    # 估計可容納 40 段以上（見 design「多段並行送審並延後印出 lkai 訊息」）
    timeout-minutes: 60
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # 一律使用 PR 的 head commit，不使用 GitHub 為 PR 建立的 merge commit：
      # inline comment 的 commit_id 必須是 PR 的 commit，行號也才會和 PR 頁面的 diff 一致
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # 每段的行數上限、同時送審的段數上限、超過多少段時發出警告（估計值，見 design）
      MAX_CHUNK_LINES: "6000"
      MAX_PARALLEL_CHUNKS: "3"
      WARN_CHUNKS: "6"
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # 不把 token 寫進 .git/config：後續步驟會執行 PR 的程式與建置 lkai，不需要也不應拿到 git 憑證
          # （fetch base commit 走公開 repo 的匿名存取）
          persist-credentials: false

      # 建置 lkai 並讀出 .github/lkai.json 中 review 設定的供應商與模型；要換審查用的模型只改那個設定
      - name: Setup lkai
        id: lkai
        uses: ./.github/actions/setup-lkai
        with:
          profile: review

      # 產生 diff、依 base commit 的 .gitattributes 排除自動產生的檔案，並依相關性切段
      - name: 規劃審查
        run: bash .github/scripts/ai-review/run-review.sh plan

      # 分批送審每一段（每批最多 MAX_PARALLEL_CHUNKS 段），需要時再送一次彙整請求，最後組出 review
      - name: 分段送審
        env:
          LKAI_PROVIDER: ${{ steps.lkai.outputs.provider }}
          LKAI_MODEL: ${{ steps.lkai.outputs.model }}
          # 三個金鑰都傳入，lkai 只讀所選供應商的那一個；沒有設定的 secret 是空字串
          LKAI_ANTHROPIC_API_KEY: ${{ secrets.LKAI_ANTHROPIC_API_KEY }}
          LKAI_OPENAI_API_KEY: ${{ secrets.LKAI_OPENAI_API_KEY }}
          LKAI_GEMINI_API_KEY: ${{ secrets.LKAI_GEMINI_API_KEY }}
        run: bash .github/scripts/ai-review/run-review.sh review

      # 發布 review（被拒時改發只有本文的版本）、收掉上一輪 AI 的討論串，並依審查結果判定成敗
      - name: 發布審查結果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ai-review/run-review.sh publish
