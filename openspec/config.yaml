schema: spec-driven

context: |
  專案架構：Monorepo，包含兩個元件
    - apps/backend/ — Python AWS Lambda（Playwright 爬蟲、S3 打包、非同步 Polling）
    - apps/web/     — Vite + React 19 + TypeScript Web app（React Router v7、Zustand、Tailwind CSS 4、react-i18next、Vitest）
  行動版 App（Flutter iOS/Android）已停止維護並自 repo 移除，最後一版保存在 mobile-v1.6.1 tag
  程式碼註解與 log 語言：所有註解、docstring、log 訊息、錯誤訊息一律以正體中文撰寫，白話說明、避免過度技術術語
  版號管理：新增功能、重大變更或修正 bug 前，須 bump 該元件 version 檔案（backend: apps/backend/pyproject.toml；web: apps/web/package.json），遵循 semver；Git Tag 格式為 backend-v<semver> 與 web-v<semver>
  Git Commit 風格：使用正體中文撰寫 Conventional Commits（<type>(<scope>): <描述>），body 使用列點格式
  開發流程：鐵的紀律，所有功能變更皆須走 Spectra SDD 流程（propose → apply ⇄ ingest → archive）
  Domain: Naver Blog 圖片下載工具，Web 前端 + 後端 Lambda 服務

rules:
  language: traditional-chinese
  design:
    - 請使用正體中文進行撰寫
  proposal:
    - 請使用正體中文進行撰寫
  specs:
    - 請使用正體中文進行撰寫
    - 使用 Given/When/Then 格式
  tasks:
    - 請使用正體中文進行撰寫

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
